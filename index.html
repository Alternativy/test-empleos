<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Match Empleos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@400;500;600;700;800&display=swap">
<style>
/* Sistema tomado de los Figma de Match Empleos (web de escritorio + web app).
   Una sola estética de marca, sin modo oscuro alternativo: azul prusiano como base,
   verde primaveral como señal, alabastro como respiro. */
:root{
  --navy:#002147;      /* fondo/base */
  --navy2:#062C56;     /* fondo/elevado */
  --gray:#E9E9E9;      /* fondo/claro (alabastro) */
  --gray2:#D9D9D9;     /* gris de "Situación actual" */
  --green:#36F48C;     /* marca/verde (manual) */
  --green-deep:#0F7A45;
  --white:#FFFFFF;
  --t2:#8EA7C6;        /* texto/secundario */
  --t3:#5D7799;        /* texto/apagado */
  --line:#16406F;      /* líneas y bordes */
  --font:"Host Grotesk", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--navy);color:var(--white);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--green);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
img{max-width:100%;display:block}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
html{scroll-behavior:smooth}

/* ================= WEB DE ESCRITORIO (Home y páginas legales) ================= */
.site{background:var(--navy);color:var(--navy);min-height:100%;overflow-x:hidden}
.wrap{width:min(1240px,100% - 32px);margin-inline:auto}
.top{background:var(--navy);height:107px;display:flex;align-items:center}
.top .wrap{display:flex;align-items:center;gap:clamp(16px,3.5vw,50px);width:min(890px,100% - 32px);justify-content:space-between}
.lockup{display:flex;align-items:center;gap:8px;text-decoration:none;flex:none}
.lockup .iso{width:41px;height:38px}
.lockup .words{display:flex;flex-direction:column;gap:2px;width:78px}
.lockup .words img:first-child{width:63px}
.lockup .words img:last-child{width:76px}
.search{flex:1;display:flex;align-items:center;height:26px;border-radius:20px;background:var(--gray2);padding:0 6px 0 14px;min-width:0}
.search input{flex:1;border:0;background:transparent;font:inherit;font-size:14px;color:var(--navy);min-width:0;outline:none}
.search button{border:0;border-left:1px solid #9a9a9a;background:transparent;padding:0 4px 0 8px;display:flex}
.top nav{display:flex;gap:clamp(16px,4.2vw,60px)}
.top nav a{color:var(--gray);text-decoration:none;font-size:20px;white-space:nowrap}
.top nav a:hover{color:var(--green)}

/* Hero */
.hero{background:linear-gradient(var(--navy) 0 45%,var(--green) 45%)}
.hero-in{background:var(--gray);border-radius:0 270px 380px 0 / 0 250px 330px 0;min-height:694px;display:grid;grid-template-columns:1fr 1.15fr;align-items:center;padding:60px clamp(16px,8vw,120px) 80px clamp(16px,8.5vw,122px);gap:40px}
.hero-in img{width:384px;justify-self:start}
.hero-txt{display:flex;flex-direction:column;align-items:center;gap:40px;text-align:center}
.hero h1{font-size:clamp(34px,3.6vw,52px);line-height:1.15;font-weight:700;color:var(--navy);letter-spacing:-.01em}
.btn-mas{display:block;width:min(545px,100%);height:52px;border:0;border-radius:30px;background:var(--green);color:var(--white);font-size:24px;font-weight:600}
.btn-mas:hover{filter:brightness(.95)}
.green-gap{background:var(--green);height:110px}

/* Quiénes somos */
.quienes{background:var(--green)}
.quienes-in{position:relative;background:var(--navy) url(img/foto-quienes.jpg) center/cover no-repeat;border-top-left-radius:78% 96%;min-height:670px;padding:70px clamp(16px,5.7vw,82px) 90px;display:flex;flex-direction:column;align-items:flex-end;scroll-margin-top:0}
.quienes h2{font-size:clamp(40px,4.4vw,64px);font-weight:700;color:var(--gray);margin-bottom:28px;letter-spacing:-.01em}
.quienes .txt{max-width:1010px;text-align:right;color:var(--gray);font-size:19px;line-height:35px;display:flex;flex-direction:column;gap:35px}

/* Situación actual */
.sit{background:var(--navy)}
.sit-in{background:var(--gray2);border-bottom-left-radius:520px 640px;padding:52px clamp(16px,5.8vw,84px) 150px;scroll-margin-top:0}
.sit h2{font-size:clamp(36px,4.2vw,60px);font-weight:700;color:var(--navy);margin-bottom:40px;letter-spacing:-.01em}
.stats{display:flex;align-items:flex-start;gap:clamp(20px,3vw,40px);padding-left:clamp(0px,7vw,100px);flex-wrap:wrap}
.stat{width:232px;min-height:298px;padding:28px 14px 24px;text-align:center;position:relative}
.stat .n{font-size:72px;font-weight:700;line-height:1;letter-spacing:-.02em;margin-bottom:22px}
.stat p{font-size:16px;line-height:1.5}
.stat.g{background:var(--green);color:var(--navy);box-shadow:11px 12px 0 var(--navy)}
.stat.d{background:var(--navy);color:var(--gray);margin-top:72px;box-shadow:-11px -12px 0 var(--green);padding-top:30px}
.stat.d .n{color:var(--gray)}
.sit .ilus{width:279px;margin-left:auto;align-self:center}
.navy-gap{background:var(--navy);height:120px}

/* Cómo funciona */
.como{background:linear-gradient(var(--navy) 0 50%,var(--gray) 50%)}
.como-in{position:relative;background:var(--green) url(img/foto-como.jpg) center/cover no-repeat;border-radius:0 300px 300px 0 / 0 330px 300px 0;min-height:790px;padding:50px clamp(16px,7vw,100px) 100px;scroll-margin-top:0}
.como h2{font-size:clamp(40px,4.4vw,64px);font-weight:700;color:var(--navy);text-align:right;padding-right:clamp(0px,17vw,250px);margin-bottom:40px;letter-spacing:-.01em}
.steps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:clamp(20px,9vw,130px);row-gap:20px;max-width:1130px}
.step{position:relative;padding:0 0 0 68px}
.step:nth-child(2){margin-top:76px}
.step:nth-child(3){margin-left:clamp(0px,11vw,160px);margin-top:-30px}
.step:nth-child(4){margin-left:clamp(0px,11vw,160px);margin-top:46px}
.step .num{z-index:2;position:absolute;left:0;top:-40px;width:128px;height:110px;border-radius:55px;background:var(--navy);color:var(--green);font-size:84px;font-weight:800;line-height:1;padding:12px 0 0 32px;letter-spacing:-.04em}
.step .card{position:relative;background:var(--navy);color:var(--white);border-radius:40px;padding:26px 28px 40px;text-align:center;max-width:344px;min-height:182px;display:flex;flex-direction:column;gap:16px}
.step h3{font-size:26px;font-weight:600;padding-left:40px;line-height:1.3}
.step p{font-size:16px;line-height:1.3}

/* Futuro */
.futuro{background:var(--gray);padding-top:40px}
.futuro h2{font-size:clamp(36px,4.2vw,60px);font-weight:700;color:var(--navy);padding:0 clamp(16px,5.8vw,84px);margin-bottom:28px;letter-spacing:-.01em}
.futuro{overflow:hidden}
.fut-in{position:relative;isolation:isolate;padding:130px clamp(16px,5vw,70px) 90px;color:var(--gray)}
.fut-in::before{content:"";position:absolute;z-index:-1;top:0;bottom:0;left:0;right:0;background:var(--navy);border-top-left-radius:78% 470px}
.fut-row{display:flex;align-items:center;gap:50px}
.fut-row.a{justify-content:flex-end}
.fut-row.a .t{text-align:right;max-width:640px}
.fut-row.a h3{font-size:34px;font-weight:600;line-height:1.05;margin-bottom:10px}
.fut-row.a p{font-size:19px;line-height:30px}
.fut-row.a img{width:353px}
.fut-row.b{margin-top:10px;gap:70px}
.fut-row.b img{width:309px}
.fut-row.b h3{font-size:clamp(40px,4.4vw,64px);font-weight:600;line-height:1;letter-spacing:-.01em}
.fut-row.b p{font-size:clamp(20px,1.9vw,27px)}

/* Footer */
.foot{background:var(--green);color:var(--navy);padding:50px 0 50px}
.foot .wrap{width:min(1156px,100% - 32px)}
.foot-cols{display:flex;gap:clamp(20px,7vw,100px);flex-wrap:wrap;padding-bottom:40px;border-bottom:2px solid var(--navy)}
.foot h4{margin:0 0 20px;font-size:36px;font-weight:600}
.foot .soc{display:flex;gap:44px;flex-wrap:wrap}
.foot .soc span{display:flex;align-items:center;gap:20px;font-size:16px}
.foot .soc svg{width:36px;height:36px;flex:none}
.foot .soc a{display:flex;align-items:center;gap:20px;color:inherit;text-decoration:none}
.btn:disabled{opacity:.45;cursor:not-allowed;pointer-events:none}
.hint{min-height:18px;font-size:13px;color:var(--t2);margin:6px 0 0;line-height:1.4}
.field[aria-invalid="true"]{border-color:#B45309}
.foot-links{display:flex;justify-content:space-between;gap:16px 30px;flex-wrap:wrap;padding:32px 0;border-bottom:2px solid var(--navy)}
.foot-links a{font-size:24px;font-weight:600;text-decoration:none}
.foot-links a:hover{text-decoration:underline}
.foot small{display:block;margin-top:24px;font-size:16px;line-height:25px}

/* Páginas legales de escritorio */
.legal-top{height:113px}
.legal-top .wrap{width:min(1252px,100% - 32px)}
.legal{background:linear-gradient(var(--navy) 0 40%,var(--green) 40%)}
.legal-in{background:var(--gray);border-radius:0 260px 380px 0 / 0 230px 420px 0;padding:34px clamp(16px,7.5vw,108px) 80px;color:var(--navy)}
.legal-in .doc{max-width:960px}
.legal-in h1{font-size:28px;font-weight:600;margin-bottom:28px}
.doc h2{font-size:17px;font-weight:700;margin:22px 0 4px}
.doc h3{font-size:15px;font-weight:700;margin:12px 0 2px}
.doc p,.doc li{font-size:15px;line-height:20px}
.doc p+p{margin-top:2px}
.doc ul{margin:4px 0;padding-left:24px}
.doc .lead{font-weight:700}
.doc .parte{display:inline-block;margin-top:26px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 10px;border-radius:20px;background:var(--navy);color:var(--green)}

/* ================= WEB APP ================= */
.app{min-height:100%;position:relative}
.app.cand{--bg:var(--navy);--fg:var(--white);--card:var(--navy2);--accent:var(--green);--on-accent:var(--navy);--sub:var(--t2);--mute:var(--t3);--bd:var(--line);--chip-bd:var(--line);--chip-fg:var(--t2);--wave:var(--green);--wave-fg:var(--navy)}
.app.emp{--bg:var(--green);--fg:var(--navy);--card:var(--navy);--accent:var(--navy);--on-accent:var(--green);--sub:#0B3A5E;--mute:#2E5E57;--bd:var(--navy);--chip-bd:var(--navy);--chip-fg:var(--navy);--wave:var(--navy);--wave-fg:var(--green)}
.app{background:var(--bg);color:var(--fg)}
.screen{width:min(100%,430px);margin-inline:auto;padding:52px 24px 190px;min-height:100%}
.hdr{display:flex;align-items:center;justify-content:space-between;min-height:24px;margin-bottom:22px;gap:12px}
.wm-link{display:inline-flex;align-items:center;align-self:flex-start;text-decoration:none;flex:none}
.hdr .wm{height:14px;width:auto;max-width:160px;object-fit:contain;flex:none}
.hdr .side{font-size:13px;color:var(--fg)}
.back{background:none;border:0;padding:0;font-size:13px;color:var(--sub);display:inline-flex;gap:8px;align-items:center}
.back:hover{color:var(--fg)}
.emp .back{color:var(--navy)}
.t-display{font-size:28px;font-weight:600;line-height:1.2;letter-spacing:-.005em}
.t-title{font-size:28px;font-weight:600;line-height:1.2}
.t-sec{font-size:18px;font-weight:600;margin:22px 0 12px}
.t-note{font-size:13px;color:var(--sub)}
.muted{color:var(--mute)}
.stack{display:flex;flex-direction:column;gap:12px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;border-radius:12px;border:0;font-weight:600;font-size:15px;text-decoration:none;padding:10px 16px;text-align:center}
.btn.pri{background:var(--accent);color:var(--on-accent)}
.cand .btn.pri{color:var(--navy)}
.btn.out{background:transparent;border:1.5px solid var(--bd);color:var(--fg)}
.btn.pri:hover{filter:brightness(1.05)}
.btn.out:hover{background:color-mix(in srgb,var(--fg) 6%,transparent)}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.btn.sm{min-height:44px;font-size:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{width:100%;height:24px;border-radius:20px;border:0;background:var(--gray);color:var(--navy);padding:0 18px;font:inherit;font-size:14px}
.field::placeholder{color:#8a8a8a}
.field.tall{height:40px;border-radius:12px}
textarea.field{height:150px;border-radius:14px;padding:12px 16px;resize:vertical;line-height:1.4}
.flabel{font-size:15px;color:var(--fg);padding-left:18px;margin-bottom:2px}
.linkline{font-size:13px;color:var(--sub);text-align:center}
.linkline button{background:none;border:0;padding:0;color:var(--fg);font-weight:700;margin-left:6px}
.linkline button:hover{text-decoration:underline}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;min-height:30px;padding:4px 10px;border-radius:20px;border:1px solid var(--chip-bd);color:var(--chip-fg);font-size:13px;background:transparent}
button.chip{cursor:pointer}
button.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:600}
.cand button.chip[aria-pressed="true"]{color:var(--navy)}
.emp .chip.fill{background:var(--navy);color:var(--green);border-color:var(--navy)}
.cand .chip.fill{background:var(--green);color:var(--navy);border-color:var(--green)}
.card{background:var(--card);border-radius:16px;padding:16px;color:var(--white)}
.emp .card{color:var(--white)}
.card .t-note,.item .t-note,.emp .card .t-note,.emp .item .t-note{color:var(--t2)}
.bignum{font-size:34px;font-weight:600;color:var(--green);line-height:1}
.dot{width:10px;height:10px;border-radius:50%;background:var(--green);flex:none}
.sq{width:28px;height:28px;border-radius:7px;background:var(--green);flex:none}
.progress{height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.emp .progress{background:color-mix(in srgb,var(--navy) 25%,transparent)}
.progress i{display:block;height:100%;background:var(--green)}
.emp .card .progress{background:var(--line)}
.top-bar{height:4px;border-radius:2px;background:color-mix(in srgb,var(--fg) 18%,transparent);margin-bottom:24px;overflow:hidden}
.top-bar i{display:block;height:100%;background:var(--accent)}
.cand .top-bar i{background:var(--green)}

/* Ola y barra inferior (teléfono) */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;pointer-events:none}
.dock svg{display:block;width:100%;height:92px}
.dock .band{background:var(--wave);height:calc(64px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);pointer-events:auto}
.dock.plain .band{height:calc(34px + env(safe-area-inset-bottom,0px))}
.nav-b{display:flex;justify-content:space-around;max-width:430px;margin:0 auto;height:64px;align-items:center}
.nav-b a{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--wave-fg);text-decoration:none;opacity:.6;min-width:54px}
.nav-b a .ico{width:20px;height:20px;border-radius:5px;background:var(--wave-fg)}
.nav-b a[aria-current="page"]{opacity:1;font-weight:700}

/* Escritorio de la app: menú lateral */
.side-nav{display:none}
@media (min-width:900px){
  .app.has-nav{display:grid;grid-template-columns:248px minmax(0,1fr)}
  .side-nav{display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;background:var(--wave);padding:36px 20px;z-index:5}
  .side-nav .wm-link{margin:0 0 40px 8px;padding:0;opacity:1;border-radius:4px}
  .side-nav .wm{height:16px;width:auto;max-width:170px;object-fit:contain;margin:0}
  .side-nav a:not(.wm-link){display:flex;align-items:center;gap:14px;padding:12px 12px;border-radius:12px;color:var(--wave-fg);text-decoration:none;font-size:16px;opacity:.65}
  .side-nav a:not(.wm-link) .ico{width:22px;height:22px;border-radius:6px;background:var(--wave-fg)}
  .side-nav a:not(.wm-link)[aria-current="page"]{opacity:1;font-weight:700;background:color-mix(in srgb,var(--wave-fg) 12%,transparent)}
  .side-nav a:not(.wm-link):hover{opacity:1}
  .side-nav .who{margin-top:auto;font-size:13px;color:var(--wave-fg);opacity:.8;padding:0 12px}
  .has-nav .dock .band{display:none}
  .has-nav .dock{left:248px}
  .has-nav .dock svg{height:120px}
  .has-nav .screen{width:min(100%,1080px);padding:56px 48px 170px}
  .has-nav .hdr .wm,.has-nav .hdr .wm-link{display:none}
  .auth .screen{width:min(100%,480px);padding-top:80px}
  .dock svg{height:150px}
  .wide2{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:40px;align-items:start}
  .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
  .split{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:24px;align-items:start}
  .only-m{display:none!important}
}
@media (max-width:899px){.only-d{display:none!important}.wide2>*+*{margin-top:0}}

/* Feed */
.offer{background:var(--navy2);border-radius:16px;overflow:hidden}
.offer .ph{width:100%;aspect-ratio:340/206;object-fit:cover;border-radius:16px 16px 0 0}
.offer .bd{padding:16px 20px 18px;display:flex;flex-direction:column;gap:12px}
.offer .co{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:500}
.offer h2{font-size:28px;font-weight:600;line-height:1.15}
.strip{display:flex;gap:12px;align-items:center;background:var(--navy);border-radius:12px;padding:14px;font-size:13px;line-height:1.45}
.cupo{font-size:13px;color:var(--t3);text-align:center;margin-top:14px}
.resp-box{border:1.5px solid var(--green);border-radius:16px;padding:16px;background:var(--navy2)}
.resp-box .lbl{font-size:12px;font-weight:600;color:var(--green);margin-bottom:6px}
.empty{border:1.5px dashed var(--line);border-radius:16px;padding:28px 20px;text-align:center;color:var(--t2);display:flex;flex-direction:column;gap:14px}
.emp .empty{border-color:var(--navy);color:var(--navy)}

/* Listas */
.item{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;border:0;background:var(--card);border-radius:16px;padding:16px;color:var(--white);text-decoration:none}
button.item:hover,a.item:hover{filter:brightness(1.15)}
.item .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.item h3{font-size:15px;font-weight:600}
.state{font-size:12px;font-weight:600;padding:3px 10px;border-radius:20px;white-space:nowrap;border:1px solid currentColor}
.state.Enviada{color:var(--t3)}
.state.Vista{color:var(--t2)}
.state.Respondida{color:var(--green)}
.steps3{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:8px}
.steps3 i{height:4px;border-radius:2px;background:var(--line)}
.steps3 i.on{background:var(--green)}
.steps3l{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;font-size:11px;color:var(--t3)}
.unread{position:relative}
.rowline{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);font-size:15px;width:100%;background:none;border-left:0;border-right:0;border-top:0;color:var(--fg);text-align:left}
.emp .rowline{border-bottom-color:var(--navy)}
button.rowline:hover{color:var(--green)}
.emp button.rowline:hover{color:var(--navy2);text-decoration:underline}
.rowline .v{color:var(--t3)}
.emp .rowline .v{color:var(--navy)}
.badge-act{background:var(--green);color:var(--navy);font-size:12px;font-weight:600;padding:4px 10px;border-radius:20px}
.badge-off{border:1px solid var(--line);color:var(--t2);font-size:12px;padding:4px 10px;border-radius:20px}

function persistir(query, etiqueta){
  if (ME.demo) return Promise.resolve(null); // modo demo: no se escribe en la base
  return query.then(({ data, error }) => {
    if (error) throw error;
    return data;
  }).catch(err => {
    console.error('[db] ' + etiqueta, err);

  });
}

  },

  guardarPostulacion(post, oid, chat){
    return persistir(sb.from('postulaciones').upsert({
      id: post.id, candidato_id: ME.id, oferta_id: oid,
      estado: post.estado, datos: { post, chat: chat || null }, updated_at: new Date().toISOString()
    }), 'guardarPostulacion');
  },

  setCupo(cupo){
    return persistir(sb.from('perfiles').update({ cupo }).eq('id', ME.id), 'setCupo');
  },

  guardarBusqueda(b){
    return persistir(sb.from('busquedas').upsert({
      id: b.id, empresa_id: ME.id, puesto: b.puesto,
      descripcion: b.desc || null, total: b.total, estado: b.estado
    }), 'guardarBusqueda');
  },

  guardarCandidato(id, corto, estado){

      id, empresa_id: ME.id, corto, estado, updated_at: new Date().toISOString()
    }), 'guardarCandidato');
  },

  setTasa(tasa){
    return persistir(sb.from('perfiles').update({ tasa }).eq('id', ME.id), 'setTasa');

  nuevoMensaje(chatKey, de, texto, h){
    return persistir(sb.from('mensajes').insert({ chat_key: chatKey, de, texto, h }), 'nuevoMensaje');

};

terminos: { titulo:'Términos y Condiciones', html:`
<p class="lead">Bienvenido a Match Empleos</p>
<p>Estos Términos y Condiciones establecen las reglas para usar Match Empleos, una plataforma que conecta a personas que buscan sus primeras oportunidades laborales con empresas y reclutadores. Al crear una cuenta, como postulante o como empresa, aceptás estos términos.</p>

<p>Una plataforma digital que facilita la conexión entre postulantes y empresas. Usa la información de los perfiles para identificar coincidencias. Facilita la conexión, pero no garantiza la obtención de un empleo ni la contratación.</p>
<h2>2. Creación de una cuenta</h2>
<p>Al registrarte te comprometés a dar información verdadera y actualizada, mantener tus datos de acceso seguros, no usar la cuenta de otra persona y no crear perfiles falsos. Cada usuario es responsable de la información que incorpora a su perfil.</p>
<h2>3. Uso de la plataforma</h2>

<h2>4. El sistema de Match</h2>
<p>Hay Match cuando el postulante se interesa por una búsqueda y la empresa se interesa por ese postulante. El Match abre un chat por 7 días. No constituye una contratación: la decisión final corresponde al postulante y a la empresa.</p>

function later(ms,fn){ timers.push(setTimeout(()=>{fn(); softRender();},ms)); }
function softRender(){
  // re-render sin perder lo que se está escribiendo
  const a=document.activeElement; const id=a&&a.id; const val=a&&('value' in a)?a.value:null;
  render(true);
  if(id){ const el=document.getElementById(id); if(el){ if(val!==null) el.value=val; el.focus(); } }
}
function apply(oid){
  const o=offerById(oid); if(!o||applied(oid)||S.c.cupo<=0) return;
  S.c.cupo--; DB.setCupo(S.c.cupo);
  if(o.match){
    const post={id:'p'+Date.now(),oid,puesto:o.puesto,emp:o.emp,estado:'Respondida',pie:'Te contestaron recién',match:true,chat:oid};

function route(){
  const h=(location.hash||'#/').replace(/^#/,'');
  const p=h.split('/').filter(Boolean);
  if(!p.length) return home();
  const [a,b,c,d]=p;
  const PUBLICAS=['privacidad','terminos','ayuda','login','recuperar','nueva-clave','registro','confirmar'];
  if(!ME.id && !ME.demo && a && !PUBLICAS.includes(a)) return login();
  if((ME.id||ME.demo) && ((a==='c'&&ME.rol!=='c')||(a==='e'&&ME.rol!=='e'))){ go(ME.rol==='e'?'#/e/panel':'#/c/feed'); return ''; }
  if(a==='privacidad'||a==='terminos'||a==='ayuda') return legalSite(a);
  if(a==='confirmar') return confirmar();
  if(a==='nueva-clave') return nuevaClave();
  if(a==='login') return login();
  if(a==='recuperar') return recuperar();
  if(a==='registro'){ if(!b) return registro(); if(b==='c') return regCand(c||'1'); if(b==='e') return regEmp(c||'1'); if(b==='terminos') return regTerminos(c); }
  if(a==='c'){
    switch(b){case 'feed':return cFeed();case 'oferta':return cOferta(c);case 'match':return cMatch(c);case 'postulaciones':return cPost();
      case 'mensajes':return mensajes('c');case 'chat':return mensajes('c',c);case 'notificaciones':return notifs('c');case 'perfil':return cPerfil();
      case 'config':return configScreen('c');case 'datos':return cDatos();case 'salir':return salir('c');case 'legal':return legalApp('c',c);}
  }
  if(a==='e'){
    switch(b){case 'panel':return ePanel();case 'publicar':return ePublicar(c);case 'candidatos':return eCandidatos();case 'candidato':return eCandidato(c);
      case 'responder':return eResponder(c,d||'si');case 'mensajes':return mensajes('e');case 'chat':return mensajes('e',c);case 'notificaciones':return notifs('e');
      case 'empresa':return eEmpresa();case 'config':return configScreen('e');case 'datos':return eDatos();case 'salir':return salir('e');case 'legal':return legalApp('e',c);}
  }
  return home();
}

function msgsDe(d,key){ return d.mensajes.filter(m=>m.chat_key===key).map(m=>({de:m.de,t:m.texto,h:m.h})); }
async function hidratar(){
  const d=await DB.cargar().catch(err=>{ console.error('No se pudo cargar desde Supabase',err); return null; });
  if(!d) return;
  const base=freshState();
  const perf=d.perfiles[0];
  if(perf && ME.rol==='c') S.c.cupo=perf.cupo;
  if(perf && ME.rol==='e') S.e.tasa=perf.tasa;
  // Candidato: postulaciones y chats creados
  const dbPosts=d.postulaciones.map(r=>({...r.datos.post,estado:r.estado}));
  const postIds=new Set(dbPosts.map(p=>p.id));
  S.c.posts=[...dbPosts,...base.c.posts.filter(p=>!postIds.has(p.id))];
  S.c.chats={...base.c.chats};
  d.postulaciones.forEach(r=>{ if(r.datos.chat) S.c.chats[r.oferta_id]={...r.datos.chat,msgs:[]}; });
  // Empresa: búsquedas y candidatos respondidos
  const dbBus=d.busquedas.map(b=>({id:b.id,puesto:b.puesto,total:d.postulaciones.filter(p=>p.oferta_id===b.id).length,estado:b.estado,desc:b.descripcion}));
  const busIds=new Set(dbBus.map(b=>b.id));
  S.e.busquedas=[...dbBus,...base.e.busquedas.filter(b=>!busIds.has(b.id))];
  const estados=new Map(d.candidatosEstado.map(r=>[r.id,r]));
  const perfilesPorId=new Map((d.candidatos||[]).map(p=>[p.id,p]));
  const postulantes=d.postulaciones.map(r=>{
    const perfil=perfilesPorId.get(r.candidato_id); const datos=perfil?.datos?.campos||{}; const chips=perfil?.datos?.chips||{}; const nombre=perfil?.nombre||'Postulante';
    const dias=Math.max(0,Math.floor((Date.now()-new Date(r.created_at||Date.now()).getTime())/86400000));
    return {id:r.id,candidato_id:r.candidato_id,oferta_id:r.oferta_id,nombre,corto:nombre.trim().split(/\s+/).slice(0,2).join(' '),edad:datos['rc-edad']||'',zona:datos['rc-ubi']||'',linea:[datos['rc-puesto'],datos['rc-ubi']].filter(Boolean).join(' · ')||'Postulante',busca:datos['rc-puesto']||'Busca trabajo',hace:dias,quedan:Math.max(0,S.e.plazo-dias),avatar:perfil?.avatar_url||'',porque:datos['rc-sobre']||'Se postuló a esta búsqueda según su perfil.',sabe:[...(chips.rubros||[]),...(datos['rx-puesto']?[datos['rx-puesto']]:[])].slice(0,4),estudios:datos['rc-estudios']||'Perfil en Match Empleos',estado:r.estado};
  });
  S.e.pend=postulantes.filter(p=>!estados.has(p.id)&&p.estado!=='Respondida'); S.e.resp=[]; S.e.chats={};
  d.candidatosEstado.forEach(r=>{ const p=postulantes.find(x=>x.id===r.id); const nombre=p?.corto||r.corto; const hasChat=r.estado==='si'||r.estado==='mas'; S.e.resp.unshift({nombre,tipo:r.estado,chat:hasChat?r.id:undefined}); if(hasChat) S.e.chats[r.id]={con:nombre,puesto:ePuestoActual(),match:r.estado==='si',msgs:[]}; });
  const empresaMap=new Map((d.empresas||[]).map(p=>[p.id,p]));
  const ofertasReales=d.busquedas.map(b=>{ const ep=empresaMap.get(b.empresa_id); const ec=ep?.datos?.campos||{}; const ecx=ep?.datos?.chips||{}; return {id:b.id,emp:ep?.nombre||'Empresa',meta:[ec['re-rubro'],ec['re-tam']].filter(Boolean).join(' · '),puesto:b.puesto,chips:[ec['re-ubi'],ecx.etipo,ecx.emodo,ecx.ehora].flat().filter(Boolean),fchips:[ec['re-ubi'],ecx.etipo,ecx.emodo].flat().filter(Boolean),tasa:ep?.tasa||94,dias:ep?.demora||3,logo:ep?.avatar_url||'',desc:b.descripcion||ec['re-desc']||''}; });
  if(ME.rol==='c' && ofertasReales.length){ const ids=new Set(S.c.ofertas.map(o=>o.id)); S.c.ofertas=[...ofertasReales.filter(o=>!ids.has(o.id)),...S.c.ofertas]; }
  // Mensajes guardados se suman a cada chat (los de ejemplo base se conservan sin duplicarse)
  Object.keys(S.c.chats).forEach(k=>{ S.c.chats[k].msgs=[...(S.c.chats[k].msgs||[]),...msgsDe(d,'c:'+k)]; });
  Object.keys(S.e.chats).forEach(k=>{ S.e.chats[k].msgs=[...(S.e.chats[k].msgs||[]),...msgsDe(d,'e:'+k)]; });
  render(true);
}

const EMAIL_RE=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
let loginTocado=false;
function validarLogin(){
  const mail=document.getElementById('lg-mail'), pass=document.getElementById('lg-pass'), hint=document.getElementById('lg-hint');
  if(!mail||!pass||!hint) return {ok:true};
  let msg='', campo=null;
  if(!EMAIL_RE.test(mail.value.trim())){ msg='Escribí un correo con formato válido, por ejemplo nombre@correo.com.'; campo=mail; }
  else if(pass.value.length<8){ msg='La contraseña tiene que tener al menos 8 caracteres.'; campo=pass; }
  hint.textContent=msg;
  mail.setAttribute('aria-invalid', String(campo===mail));
  pass.setAttribute('aria-invalid', String(campo===pass));
  return {ok:!msg, campo};
}
document.addEventListener('input',e=>{ if(loginTocado && (e.target.id==='lg-mail'||e.target.id==='lg-pass')) validarLogin(); });
async function iniciarSesionForm(){

  } else {
    console.warn('[auth] login falló:', error.message);
    document.getElementById('lg-hint').innerHTML='Correo o contraseña incorrectos. <button type="button" data-go="#/recuperar" style="background:none;border:0;padding:0;color:inherit;text-decoration:underline;cursor:pointer;font:inherit">¿Olvidaste tu contraseña?</button>';
  }
}

async function subirFoto(file){

  if(file.size>2*1024*1024){ toast('La foto no puede pesar más de 2 MB.'); return; }
  toast('Subiendo foto…');
  const ruta=`${ME.id}/avatar`;
  const subida=await persistir(sb.storage.from('avatars').upload(ruta,file,{upsert:true,contentType:file.type,cacheControl:'3600'}),'subirFoto');
  if(subida===null) return;
  const {data:pub}=sb.storage.from('avatars').getPublicUrl(ruta);
  const url=`${pub.publicUrl}?v=${Date.now()}`;
  const guardado=await persistir(sb.from('perfiles').update({avatar_url:url}).eq('id',ME.id),'guardarFoto');
  if(guardado===null) return;
  ME.avatarUrl=url;
  render(true);
  toast('Foto actualizada.');
}
function perfilDatos(){
  const campos={};
  Object.keys(regDraft).forEach(k=>{ if(/^(rc|re|rx)-/.test(k) && !/(pass|mail|cv|cv-name)$/.test(k) && regDraft[k]) campos[k]=regDraft[k]; });
  return {campos, chips:{...S.reg.chips}};
}
async function reenviarConfirmacion(){
  const email=(ultimoCorreo||(document.getElementById('lg-mail')?.value||'')).trim();
  if(!EMAIL_RE.test(email)){ toast('Escribí tu correo primero.'); return; }
  const {error}=await sb.auth.resend({type:'signup',email});
  toast(error?'No pudimos reenviar el correo. Probá de nuevo en unos minutos.':'Te reenviamos el correo de confirmación.');
}
async function crearCuenta(kind){
  const p=kind==='e'?'re-':'rc-';
  const email=(regDraft[p+'mail']||'').trim();
  const password=regDraft[p+'pass']||'';
  if(!email||password.length<8){ toast('Revisá el correo y usá una contraseña de al menos 8 caracteres.'); go(kind==='e'?'#/registro/e/1':'#/registro/c/1'); return; }
  const nombre=kind==='e'?(regDraft['re-nom']||''):[regDraft['rc-nom'],regDraft['rc-ape']].filter(Boolean).join(' ');
  ultimoCorreo=email;
  const {data,error}=await sb.auth.signUp({email,password,options:{data:{rol:kind,nombre,display_name:nombre,full_name:nombre,datos:perfilDatos()}}});
  if(error){ toast(/already registered/i.test(error.message)?'Ya existe una cuenta con ese correo.':'No pudimos crear la cuenta. Probá de nuevo.'); return; }
  regDraft={}; S.reg={chips:{}};
  if(data.session) go(kind==='e'?'#/e/panel':'#/c/feed'); else go('#/confirmar');
}
async function recuperarForm(){
  const email=(document.getElementById('rc-mail').value||'').trim();
  if(!EMAIL_RE.test(email)){ toast('Escribí un correo con formato válido.'); return; }
  await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
  toast('Si el correo existe, te enviamos el enlace.');
  go('#/login');
}
async function nuevaClaveForm(){
  const password=document.getElementById('nc-pass').value||'';
  if(password.length<8){ toast('La contraseña debe tener al menos 8 caracteres.'); return; }
  const {error}=await sb.auth.updateUser({password});
  if(error){ toast('No pudimos cambiar la contraseña. Pedí un enlace nuevo.'); return; }
  toast('Contraseña actualizada.');
  go(ME.rol==='e'?'#/e/panel':'#/c/feed');
}
function verificarCoincidencia(pfx,email,pwd){
  if(pfx==='rg') return null;
  const mailOrig=(regDraft['rg-mail']||'').trim().toLowerCase(), passOrig=regDraft['rg-pass']||'';
  if(mailOrig && email && email.toLowerCase()!==mailOrig)
    return {campo:'mail', msg:'El correo no coincide con el que escribiste en la pantalla anterior. Lo pedimos dos veces porque, si no coincide, no vas a poder confirmar tu cuenta.'};
  if(passOrig && pwd && pwd!==passOrig)
    return {campo:'pass', msg:'La contraseña no coincide con la que escribiste en la pantalla anterior. La pedimos dos veces para evitar errores de tipeo.'};
  return null;
}
function validarCred(pfx,checkCoincidencia=false){
  const mail=document.getElementById(pfx+'-mail'), pass=document.getElementById(pfx+'-pass'), hint=document.getElementById(pfx+'-hint');
  if(!mail||!pass) return false;
  const email=mail.value.trim(), pwd=pass.value;
  let msg='', campo=null;
  if(email||pwd){
    if(!EMAIL_RE.test(email)){ msg='Escribí un correo con formato válido, por ejemplo nombre@correo.com.'; campo=mail; }
    else if(pwd.length<8){ msg='La contraseña tiene que tener al menos 8 caracteres.'; campo=pass; }
    else if(checkCoincidencia){ const c=verificarCoincidencia(pfx,email,pwd); if(c){ msg=c.msg; campo=c.campo==='mail'?mail:pass; } }
  }
  if(hint) hint.textContent=msg;
  mail.setAttribute('aria-invalid', String(campo===mail));
  pass.setAttribute('aria-invalid', String(campo===pass));
  const ok=!msg && EMAIL_RE.test(email) && pwd.length>=8;
  if(pfx==='rg') document.querySelectorAll('[data-cred="'+pfx+'"]').forEach(b=>{ b.disabled=!ok; });
  return ok;
}
document.addEventListener('input',e=>{ const m=/^(rg|rc|re)-(mail|pass)$/.exec(e.target.id||''); if(m) validarCred(m[1],false); });
function confirmar(){ return authShell(`<div class="hdr">${WM}</div><h1 class="t-display" style="margin:28px 0 24px">Revisá tu correo</h1><p class="t-note">Te enviamos un enlace para confirmar tu cuenta${ultimoCorreo?' a <strong>'+esc(ultimoCorreo)+'</strong>':''}. Si no lo ves, revisá la carpeta de spam.</p><div class="stack" style="margin-top:40px"><button class="btn out" data-action="reenviar">Reenviar correo</button><button class="btn pri" data-go="#/login">Ya confirmé, iniciar sesión</button></div>`); }
function nuevaClave(){ return authShell(`<div class="hdr">${WM}</div><h1 class="t-display" style="margin:16px 0 18px">Nueva contraseña</h1><form data-form="nueva-clave" class="stack" style="margin-top:40px"><label class="vh" for="nc-pass">Nueva contraseña</label><input class="field" id="nc-pass" type="password" placeholder="Mínimo 8 caracteres" autocomplete="new-password"><button class="btn pri" type="submit" style="margin-top:28px">Guardar contraseña</button></form>`); }

// Demo: sin login y sin escrituras en la base. Para quitarla, poner en false o borrar este bloque.
const DEMO_HABILITADO = true;
function miNombre(kind){ if(ME.demo) return kind==='e'?'Café Mercado':'Tomás Ferreyra'; return ME.nombre||''; }
function fotoSrc(defecto){ return ME.demo ? defecto : (ME.avatarUrl||defecto); }
function subtituloEmpresa(){
  if(ME.demo) return 'Gastronomía · 12 empleados · Lomas de Zamora';
  const c=ME.datos?.campos||{};
  return [c['re-rubro'],c['re-tam'],c['re-ubi']].filter(x=>x&&String(x).trim()).map(x=>esc(x)).join(' · ');
}
function subtituloCandidato(){
  if(ME.demo) return 'Lomas de Zamora · Busco mi primer trabajo';
  const u=(ME.datos?.campos||{})['rc-ubi'];
  return u?esc(u):'';
}
const formatoFotoOK=['image/jpeg','image/png','image/webp'];
function miPrimerNombre(){ return miNombre().split(' ')[0] || ''; }
function entrarDemo(kind){
  if(!DEMO_HABILITADO) return;
  ME={id:null,rol:kind,nombre:null,demo:true};
  S=freshState();
  go(kind==='e'?'#/e/panel':'#/c/feed');
}
async function asegurarBusquedaEmpresa(){
  if(ME.rol!=='e'||!ME.id) return; const puesto=(ME.datos?.campos||{})['re-puesto']?.trim(); if(!puesto) return;
  const {data:existente}=await sb.from('busquedas').select('id').eq('empresa_id',ME.id).limit(1); if(existente?.length) return;
  await DB.guardarBusqueda({id:'registro-'+ME.id,puesto,total:0,estado:'Activa',desc:(ME.datos?.campos||{})['re-desc']||''});
}
async function setSesion(session){
  if(!session){ ME={id:null,rol:null,nombre:null,email:null,datos:{},avatarUrl:null,demo:false}; S=freshState(); return; }
  ME.id=session.user.id; ME.demo=false;
  const {data:perfil}=await sb.from('perfiles').select('rol,nombre,datos,avatar_url').eq('id',ME.id).maybeSingle();
  ME.rol=perfil?.rol||null; ME.nombre=perfil?.nombre||null; ME.datos=perfil?.datos||{}; ME.avatarUrl=perfil?.avatar_url||null; ME.email=session.user.email||'';
  if(!ME.rol){ toast('Tu cuenta no tiene perfil. Escribinos para resolverlo.'); await sb.auth.signOut(); return; }
  if(ME.rol==='e') await asegurarBusquedaEmpresa(); S=freshState(); await hidratar();
}
document.addEventListener('db-error',()=>toast('No se pudo guardar. Revisá tu conexión.'));
let ultimoUid=undefined;
render();
sb.auth.onAuthStateChange((evento,session)=>{
  if(evento==='TOKEN_REFRESHED') return;
  setTimeout(async()=>{
    const uid=session?.user?.id??null;
    ultimoUid=uid;
    await setSesion(session);
    if(evento==='PASSWORD_RECOVERY'){ go('#/nueva-clave'); return; }
    const enPantallaDeAcceso = ['#/login','#/registro','#/confirmar'].some(h=>location.hash.startsWith(h));
    if(evento==='SIGNED_IN' && (VINO_DE_CORREO || enPantallaDeAcceso)){
      if(VINO_DE_CORREO) toast('¡Cuenta confirmada! Bienvenido/a a Match Empleos.');
      go(ME.rol==='e'?'#/e/panel':'#/c/feed');
    }
    render();
  },0);
});

})();
